AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Event-Driven IoT Platform - IoT event pipeline.
  Ingests smart home device events via API Gateway + Lambda,
  stores in DynamoDB, and exposes a query API for the dashboard.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment stage.

  TableName:
    Type: String
    Default: ""
    Description: >
      DynamoDB table name. Leave blank to auto-generate as eip-events-{Stage}.

  TTLDays:
    Type: Number
    Default: 30
    Description: Days before events are automatically deleted.

  AlertEmail:
    Type: String
    Default: ""
    Description: Email to receive welfare alerts. Blank = skip the email subscription.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        # Must be the real table name (eip-events-{Stage}), not the TableName
        # parameter — that defaults to "" and left ingest/query with an empty
        # TABLE_NAME. !Ref EventsTable resolves to the actual table.
        TABLE_NAME: !Ref EventsTable
        STAGE: !Ref Stage
        TTL_DAYS: !Ref TTLDays
    Tracing: Active
    Tags:
      Project: event-driven-iot-platform
      Stage: !Ref Stage

Conditions:
  IsProd: !Equals [!Ref Stage, prod]
  UseDefaultTableName: !Equals [!Ref TableName, ""]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:

  EventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If
        - UseDefaultTableName
        - !Sub "eip-events-${Stage}"
        - !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
        - AttributeName: ts
          AttributeType: N
        - AttributeName: type
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
        - AttributeName: ts
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # Serves the dashboard's per-type time-series reads (temp line, plug
        # hourly bars) as a single-partition Query instead of a full-table Scan.
        # This is the read-path fix and is independent of the async projection.
        - IndexName: type-ts-index
          KeySchema:
            - AttributeName: type
              KeyType: HASH
            - AttributeName: ts
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        # NEW_IMAGE is all the async consumers need: the post-write item.
        # Change-data-capture source for the fan-out path (see docs/adr/0002).
        StreamViewType: NEW_IMAGE
      TimeToLiveSpecification:
        AttributeName: expire_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: event-driven-iot-platform
        - Key: Stage
          Value: !Ref Stage

  IngestFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: DynamoDBWriteEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt EventsTable.Arn

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub eip-ingest-${Stage}
      CodeUri: ../ingest/
      Handler: handler.lambda_handler
      Role: !GetAtt IngestFunctionRole.Arn
      Description: Validates and stores IoT device events from API Gateway
      Events:
        IngestEvent:
          Type: Api
          Properties:
            RestApiId: !Ref EipApi
            Path: /events
            Method: POST

  QueryFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: DynamoDBReadEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt EventsTable.Arn
                  # Querying the type-ts GSI needs permission on the index ARN too.
                  - !Sub "${EventsTable.Arn}/index/*"
                  # GET /state reads the current entity-state projection.
                  - !GetAtt ProjectionTable.Arn
        - PolicyName: ReadCandidateFrames
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # GET /sightings presigns camera-frame URLs for the dashboard gallery.
              # Hard-coded ARN (not !GetAtt) to avoid a Bucket->Enrichment->Api->Query
              # circular dependency — same trick as EnrichmentFunctionRole below.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::eip-candidate-frames-${Stage}-${AWS::AccountId}/*"

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub eip-query-${Stage}
      CodeUri: ../query/
      Handler: handler.lambda_handler
      Role: !GetAtt QueryFunctionRole.Arn
      Description: Queries DynamoDB for device events to power the dashboard
      Environment:
        Variables:
          PROJECTION_TABLE_NAME: !Ref ProjectionTable
          # Hard-coded name (not !Ref) for the same circular-dependency reason as
          # the ReadCandidateFrames policy above.
          FRAMES_BUCKET: !Sub "eip-candidate-frames-${Stage}-${AWS::AccountId}"
      Events:
        GetAllEvents:
          Type: Api
          Properties:
            RestApiId: !Ref EipApi
            Path: /events
            Method: GET
        GetDeviceEvents:
          Type: Api
          Properties:
            RestApiId: !Ref EipApi
            Path: /events/{device_id}
            Method: GET
        GetEntityState:
          Type: Api
          Properties:
            RestApiId: !Ref EipApi
            Path: /state
            Method: GET
        GetSightings:
          Type: Api
          Properties:
            RestApiId: !Ref EipApi
            Path: /sightings
            Method: GET
        GetIntrusions:
          Type: Api
          Properties:
            RestApiId: !Ref EipApi
            Path: /intrusions
            Method: GET

  EipApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Description: Event-Driven IoT Platform IoT ingestion and query API
      # Lets the browser dashboard + check-in page call the API cross-origin.
      # SAM adds an OPTIONS (preflight) responder to each route; the Lambdas
      # already return Access-Control-Allow-Origin on the actual responses.
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}'

  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/eip-ingest-${Stage}
      RetentionInDays: !If [IsProd, 90, 14]

  QueryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/eip-query-${Stage}
      RetentionInDays: !If [IsProd, 90, 14]

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/eip-api-${Stage}
      RetentionInDays: !If [IsProd, 90, 14]

  IngestErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub eip-ingest-errors-${Stage}
      AlarmDescription: Ingest Lambda error count exceeds threshold in 5 min window
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  IngestLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub eip-ingest-p95-latency-${Stage}
      AlarmDescription: Ingest Lambda P95 duration exceeds 3000ms
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  QueryErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub eip-query-errors-${Stage}
      AlarmDescription: Query Lambda error count exceeds threshold
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref QueryFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ===========================================================================
  # Async fan-out path: Streams -> stream consumer -> SNS -> {SQS projection,
  # anomaly alerter}. See docs/adr/0002-0004.
  # ===========================================================================

  ProjectionTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub eip-projection-${Stage}
      BillingMode: PAY_PER_REQUEST
      # Current-state read model. Two item shapes share the (pk, device_id) key:
      # legacy {pk: "TYPE#<type>", device_id} and entity-welfare state
      # {pk: "ENTITY#<entity>", device_id: "STATE"} (see docs/adr/0006).
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: pk          # "TYPE#<type>"
          KeyType: HASH
        - AttributeName: device_id
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: event-driven-iot-platform
        - Key: Stage
          Value: !Ref Stage

  EventStoredTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub eip-event-stored-${Stage}

  StreamConsumerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub eip-stream-consumer-dlq-${Stage}
      MessageRetentionPeriod: 1209600   # 14 days

  StreamConsumerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: StreamReadPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:DescribeStream
                Resource: !GetAtt EventsTable.StreamArn
              - Effect: Allow
                # ListStreams has no resource-level support; this wildcard is
                # required by the service and is the only one in this template.
                Action: dynamodb:ListStreams
                Resource: "*"
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref EventStoredTopic
              - Effect: Allow
                # The event source mapping delivers failed batches here.
                Action: sqs:SendMessage
                Resource: !GetAtt StreamConsumerDLQ.Arn

  StreamConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub eip-stream-consumer-${Stage}
      CodeUri: ../stream_consumer/
      Handler: handler.lambda_handler
      Role: !GetAtt StreamConsumerFunctionRole.Arn
      Description: Republishes INSERT stream records as SNS event-stored messages
      Environment:
        Variables:
          EVENT_STORED_TOPIC_ARN: !Ref EventStoredTopic
      Events:
        Stream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt EventsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumRetryAttempts: 3
            BisectBatchOnFunctionError: true
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"]}'
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt StreamConsumerDLQ.Arn

  StreamConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/eip-stream-consumer-${Stage}
      RetentionInDays: !If [IsProd, 90, 14]

  # ---- SNS -> SQS -> projection writer (sole writer, buffered/competing) ----

  ProjectionDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub eip-projection-dlq-${Stage}
      MessageRetentionPeriod: 1209600   # 14 days

  ProjectionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub eip-projection-${Stage}
      # 2x the 30s function timeout. AWS recommends 6x to avoid reprocessing
      # during long invocations, but projection writes finish in milliseconds,
      # so 2x is safe and keeps redrive latency (~maxReceiveCount x VT) low
      # enough to be operationally observable rather than a ~9 min wait.
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProjectionDLQ.Arn
        maxReceiveCount: 3

  ProjectionQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProjectionQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ProjectionQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref EventStoredTopic

  EventStoredToProjectionQueue:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref EventStoredTopic
      Protocol: sqs
      Endpoint: !GetAtt ProjectionQueue.Arn
      RawMessageDelivery: true          # SQS + alerter see the same raw contract

  ProjectionConsumerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: ConsumeQueueWriteProjection
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ProjectionQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !GetAtt ProjectionTable.Arn

  ProjectionConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub eip-projection-consumer-${Stage}
      CodeUri: ../projection_consumer/
      Handler: handler.lambda_handler
      Role: !GetAtt ProjectionConsumerFunctionRole.Arn
      Description: Writes the current-state projection from event-stored messages
      Environment:
        Variables:
          PROJECTION_TABLE_NAME: !Ref ProjectionTable
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt ProjectionQueue.Arn
            BatchSize: 10

  ProjectionConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/eip-projection-consumer-${Stage}
      RetentionInDays: !If [IsProd, 90, 14]

  # ---- SNS -> anomaly alerter (second, independent fan-out consumer) --------

  AnomalyAlerterFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: PublishAnomalyMetric
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                # PutMetricData has no resource ARN; constrain by namespace.
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: EventDrivenIotPlatform
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
        - PolicyName: ArrivalDedupeState
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Advances the alerter's own ALERT#zeus/STATE item to dedupe
              # "Zeus is here" notices (one per visit).
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt ProjectionTable.Arn

  AnomalyAlerterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub eip-alerter-${Stage}
      CodeUri: ../alerter/
      Handler: handler.lambda_handler
      Role: !GetAtt AnomalyAlerterFunctionRole.Arn
      Description: Flags out-of-range readings as a CloudWatch metric + welfare alert
      Environment:
        Variables:
          ALERT_TOPIC_ARN: !Ref AlertTopic
          PROJECTION_TABLE_NAME: !Ref ProjectionTable
          ARRIVAL_GAP_SECONDS: '1800'
          INTRUDER_GAP_SECONDS: '1800'
      Events:
        Alert:
          Type: SNS
          Properties:
            Topic: !Ref EventStoredTopic

  AnomalyAlerterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/eip-alerter-${Stage}
      RetentionInDays: !If [IsProd, 90, 14]

  # ---- Welfare alert notifications (alerter publishes here; email subscribes) -

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub eip-welfare-alerts-${Stage}

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ---- Alarms for the async path (see docs/adr/0001 for threshold reasoning) -

  StreamConsumerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub eip-stream-consumer-errors-${Stage}
      AlarmDescription: Stream consumer Lambda errors (publish failures)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref StreamConsumerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  StreamConsumerIteratorAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub eip-stream-iterator-age-${Stage}
      AlarmDescription: Stream consumer falling behind (async projection lag rising)
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions:
        - Name: FunctionName
          Value: !Ref StreamConsumerFunction
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 60000            # ms; sustained >60s lag between write and fan-out
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ProjectionConsumerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub eip-projection-consumer-errors-${Stage}
      AlarmDescription: Projection consumer Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProjectionConsumerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AlerterErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub eip-alerter-errors-${Stage}
      AlarmDescription: Anomaly alerter Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnomalyAlerterFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ProjectionDLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub eip-projection-dlq-depth-${Stage}
      AlarmDescription: Poison messages parked in the projection DLQ (needs redrive)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ProjectionDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  StreamConsumerDLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub eip-stream-consumer-dlq-depth-${Stage}
      AlarmDescription: Failed stream batches parked in the stream-consumer DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt StreamConsumerDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---- Phase 1: edge candidate-frame upload (see docs/adr/0005, 0007) --------

  CandidateFramesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub eip-candidate-frames-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # Frames exist only for recognition; keep the exposure window short.
          - Id: expire-candidate-frames
            Status: Enabled
            ExpirationInDays: 7
      Tags:
        - Key: Project
          Value: event-driven-iot-platform
        - Key: Stage
          Value: !Ref Stage

  EdgeUploaderUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub eip-edge-uploader-${Stage}
      Policies:
        - PolicyName: PutCandidateFramesOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${CandidateFramesBucket.Arn}/*"

  EdgeUploaderAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref EdgeUploaderUser

  # ---- Phase 2: enrichment (Bedrock vision recognition) ----------------------

  EnrichmentFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: EnrichmentAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Literal ARNs (not !GetAtt) to avoid a Role->Bucket dependency:
              # the bucket's S3 event already makes Bucket depend on this
              # function, so a GetAtt here would close a circular dependency.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::eip-candidate-frames-${Stage}-${AWS::AccountId}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::eip-candidate-frames-${Stage}-${AWS::AccountId}"
              - Effect: Allow
                # Bedrock vision model invocation (Converse API).
                Action: bedrock:InvokeModel
                Resource: "*"

  EnrichmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub eip-enrichment-${Stage}
      CodeUri: ../enrichment/
      Handler: handler.lambda_handler
      Timeout: 60
      MemorySize: 512
      Role: !GetAtt EnrichmentFunctionRole.Arn
      Description: Recognizes Zeus in candidate frames via Bedrock vision, posts sightings
      Environment:
        Variables:
          BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-4-6
          INGEST_URL: !Sub https://${EipApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
          # Drop low-confidence recognitions (real Zeus scores ~0.82–0.95; a night
          # empty-porch false positive scored 0.72). Raised from the 0.6 default.
          CONFIDENCE_MIN: '0.8'
      Events:
        FrameUploaded:
          Type: S3
          Properties:
            Bucket: !Ref CandidateFramesBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: frames/

  EnrichmentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/eip-enrichment-${Stage}
      RetentionInDays: !If [IsProd, 90, 14]

Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL
    Value: !Sub https://${EipApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
    Export:
      Name: !Sub eip-api-url-${Stage}

  IngestEndpoint:
    Description: POST endpoint for device events
    Value: !Sub https://${EipApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/events

  QueryEndpoint:
    Description: GET endpoint for dashboard queries
    Value: !Sub https://${EipApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/events

  EventsTableName:
    Description: DynamoDB table name
    Value: !Ref EventsTable
    Export:
      Name: !Sub eip-table-name-${Stage}

  EventsTableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt EventsTable.Arn

  IngestFunctionArn:
    Description: Ingest Lambda ARN
    Value: !GetAtt IngestFunction.Arn

  QueryFunctionArn:
    Description: Query Lambda ARN
    Value: !GetAtt QueryFunction.Arn

  ProjectionTableName:
    Description: DynamoDB projection (current-state) table name
    Value: !Ref ProjectionTable
    Export:
      Name: !Sub eip-projection-table-${Stage}

  EventStoredTopicArn:
    Description: SNS topic ARN for event-stored fan-out
    Value: !Ref EventStoredTopic

  StreamConsumerDLQUrl:
    Description: DLQ for failed stream-consumer batches
    Value: !Ref StreamConsumerDLQ

  ProjectionQueueUrl:
    Description: SQS queue feeding the projection writer
    Value: !Ref ProjectionQueue

  ProjectionDLQUrl:
    Description: DLQ for poison projection messages (redrive target)
    Value: !Ref ProjectionDLQ

  CandidateFramesBucketName:
    Description: S3 bucket for edge candidate frames (set as EIP_FRAMES_BUCKET on the edge)
    Value: !Ref CandidateFramesBucket

  EdgeUploaderAccessKeyId:
    Description: Access key id for the least-privilege edge uploader (PutObject only)
    Value: !Ref EdgeUploaderAccessKey

  EdgeUploaderSecretAccessKey:
    Description: Secret for the edge uploader — set as AWS_SECRET_ACCESS_KEY on the edge machine
    Value: !GetAtt EdgeUploaderAccessKey.SecretAccessKey
