# =============================================================================
# Smart Living Ledger — CI/CD Pipeline
# =============================================================================
# Two jobs run in sequence:
#   1. test  — runs on every push to any branch (catches bugs early)
#   2. deploy — runs only on push to main (after tests pass)
#
# This means: feature branches get tested but not deployed.
# Only reviewed, merged code reaches AWS.
# =============================================================================

name: Smart Living Ledger CI/CD

# ---------------------------------------------------------------------------
# Triggers: when does this workflow run?
# ---------------------------------------------------------------------------
on:
  push:
    branches:
      - "**"          # CI (test job) runs on every branch push
  pull_request:
    branches:
      - main          # Also run tests when a PR targets main

# ---------------------------------------------------------------------------
# Environment variables available to all jobs
# ---------------------------------------------------------------------------
env:
  AWS_REGION: us-east-1          # Change to your region if different
  SAM_STACK_NAME: smart-living-ledger-dev
  PYTHON_VERSION: "3.11"

# =============================================================================
# JOB 1: TEST
# Runs on every push. No AWS credentials needed — pure unit tests.
# =============================================================================
jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest        # GitHub-hosted runner (fresh VM each time)

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the repo code onto the runner
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up the Python version we develop with locally
      #    Pinning the version prevents "works on my machine" surprises
      # -----------------------------------------------------------------------
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"            # Cache pip downloads — speeds up future runs

      # -----------------------------------------------------------------------
      # 3. Install dependencies
      #    We install from requirements.txt so CI matches local dev exactly
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # 4. Run the unit tests (no AWS needed)
      #    -v = verbose output so failures are easy to read in the Actions log
      #    Runs the whole tests/ dir; the integration/load/async tests skip
      #    themselves without a deployed stack (SLL_API_URL / queue URLs), so
      #    this stays AWS-free while covering every unit suite automatically.
      # -----------------------------------------------------------------------
      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

      # -----------------------------------------------------------------------
      # 5. Check code style with flake8 (non-blocking)
      #    E501 = line too long (we ignore it — not worth fighting)
      #    This catches obvious errors like undefined variables
      # -----------------------------------------------------------------------
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 ingest/ query/ simulator/ tests/ \
            --max-line-length=120 \
            --extend-ignore=E501 \
            --exclude=__pycache__,.venv,ingest/package,query/package
        continue-on-error: true   # Lint failures warn but don't block deploy
                                  # Change to false when you want strict linting

  # ===========================================================================
  # JOB 2: DEPLOY
  # Only runs when pushing to main AND the test job passed.
  # This is the "if tests are green, ship it" gate.
  # ===========================================================================
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: test                   # ← This is the dependency gate.
                                  #   deploy won't start unless test passes.

    # Only deploy on pushes to main — not on PRs, not on feature branches
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out code
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Python (SAM uses it to build Lambda packages)
      # -----------------------------------------------------------------------
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # -----------------------------------------------------------------------
      # 3. Configure AWS credentials from GitHub Secrets
      #    The secrets are injected as environment variables — never in code.
      #    aws-actions/configure-aws-credentials handles the credential chain.
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------------
      # 4. Install AWS SAM CLI
      #    The GitHub runner doesn't have SAM pre-installed.
      #    pip install is the simplest cross-platform approach.
      # -----------------------------------------------------------------------
      - name: Install AWS SAM CLI
        run: |
          pip install aws-sam-cli

      # -----------------------------------------------------------------------
      # 5. Install project dependencies
      #    Needed so SAM can build the Lambda packages correctly
      # -----------------------------------------------------------------------
      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # 6. SAM Build
      #    Compiles your Lambda functions and resolves dependencies.
      #    Output goes to .aws-sam/build/ — SAM knows where to find it.
      # -----------------------------------------------------------------------
      - name: SAM Build
        run: |
          sam build \
            --template-file infra/template.yaml

      # -----------------------------------------------------------------------
      # 7. SAM Deploy
      #    --no-confirm-changeset = don't wait for human approval (automated)
      #    --no-fail-on-empty-changeset = don't error if nothing changed
      #    --capabilities CAPABILITY_IAM = allow SAM to create IAM roles
      #    --parameter-overrides = pass runtime config without editing template
      # -----------------------------------------------------------------------
      - name: SAM Deploy
        env:
          SAM_CLI_TELEMETRY: 0
        run: |
          sam deploy \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --parameter-overrides Stage=dev \
            --template-file infra/template.yaml \
            --no-progressbar

      # -----------------------------------------------------------------------
      # 8. Print the deployed API Gateway URL
      #    Useful for debugging — you can see the live URL in the Actions log
      # -----------------------------------------------------------------------
      - name: Print API Gateway URL
        run: |
          echo "=== Deployed Stack Outputs ==="
          aws cloudformation describe-stacks \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs" \
            --output table
